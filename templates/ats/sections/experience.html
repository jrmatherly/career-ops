<!--
  experience.html — ATS section partial for Work Experience.

  Field placeholders filled per entry:
    COMPANY          — employer name
    PERIOD           — date range
    ROLE             — job title
    BULLETS          — rendered <li> tags (those ahead of the first paragraph that follows a bullet, when AFTER_BULLETS is used)
    AFTER_BULLETS    — the paragraphs that follow bullets and the lists after them, in order; empty for most entries.
                       A pack that leaves it out gets every bullet in BULLETS and those paragraphs in CONTEXT.
    LOCATION_BLOCK   — conditional: .job-location div when location present; omitted when absent
    CONTEXT_BLOCK    — conditional: .job-context div (un-bulleted company/scope note) when context present; omitted when absent

  Template packs: edit tag names, class names, and field order freely inside the ENTRY zone.
-->
<!--ENTRY-->
<div class="job">
  <div class="job-role">{{ROLE}}</div>
  <div class="job-company">{{COMPANY}}</div>
  {{CONTEXT_BLOCK}}
  {{LOCATION_BLOCK}}
  <div class="job-period">{{PERIOD}}</div>
  <ul>
    {{BULLETS}}
  </ul>{{AFTER_BULLETS}}
</div>
<!--LOCATION_BLOCK--><div class="job-location">{{LOCATION}}</div><!--/LOCATION_BLOCK-->
<!--CONTEXT_BLOCK--><div class="job-context">{{CONTEXT}}</div><!--/CONTEXT_BLOCK-->
<!--/ENTRY-->
