# Fork-only scope: npm and Go pins arrive through the upstream sync
# (/upstream-review). Renovate (renovate.json) moves what the fork pins itself:
# the SHA-pinned GitHub Actions, the Docker base digests and golangci-lint.
# No version updates here, so the two bots never open the same bump. Dependabot
# security updates are a repository setting and do not read this file.
version: 2
updates: []
