name: "🐳 Docker images"

# Fork-only: publishes the two images this repo builds to GitHub Container
# Registry, so `docker compose pull` and the test workflow fetch them instead
# of rebuilding. Upstream builds career-ops:local and the cv-visual image
# ad hoc; it ships no registry workflow.
#
#   ghcr.io/<owner>/career-ops            root Dockerfile (dev container, linux/amd64 + arm64)
#   ghcr.io/<owner>/career-ops-cv-visual  tests/cv-visual (CI rendering image, linux/amd64)
#
# Tags: `latest` on main, `sha-<short>` on every build, the git tag on `v*` tags.
# The first push creates each package as private; make them public in the
# package settings once, or every pull needs a token.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - Dockerfile
      - .hadolint.yaml
      - .dockerignore
      - package.json
      - tests/cv-visual/Dockerfile
      - .github/workflows/docker-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: "🐳 publish ${{ matrix.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "career-ops"
            context: .
            file: Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: "career-ops-cv-visual"
            context: tests/cv-visual
            file: tests/cv-visual/Dockerfile
            platforms: linux/amd64
    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "🔍 Lint Dockerfile"
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.file }}
          config: .hadolint.yaml
          failure-threshold: warning
      - name: "🧰 Set up QEMU"
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: contains(matrix.platforms, 'arm64')
      - name: "🧰 Set up Buildx"
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: "🔐 Log in to GHCR"
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag
      - name: "🚀 Build and push"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
