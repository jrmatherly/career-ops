name: "🐳 Docker images"

# Fork-only: publishes the four images this repo builds to GitHub Container
# Registry, so `docker compose pull`, the test workflow and the home cluster
# fetch them instead of rebuilding. Upstream builds career-ops:local and the
# cv-visual image ad hoc; it ships no registry workflow.
#
#   ghcr.io/<owner>/career-ops            root Dockerfile (dev container, linux/amd64 + arm64)
#   ghcr.io/<owner>/career-ops-cv-visual  tests/cv-visual (CI rendering image, linux/amd64)
#   ghcr.io/<owner>/career-ops-server     deploy/Dockerfile (hosted web + CLI, linux/amd64)
#   ghcr.io/<owner>/career-ops-publish    publish/Dockerfile (share-page service, linux/amd64)
#
# Every push to main builds, with no path filter: the server image copies the
# whole checkout, so any commit changes it. The other three rebuild from the
# layer cache when their inputs did not change.
# On a pull request that touches image inputs the images build without pushing.
#
# Tags: `latest` on main, `sha-<short>` on every build, and on a fork release tag
# (`career-ops-vX.Y.Z`, cut by release.yml) both the tag itself and the bare `X.Y.Z`.
# The first push creates each package as private; make them public in the
# package settings once, or every pull needs a token.
#
# Docker Hub mirror: the two images the cluster deploys (`mirror: true` in the
# matrix) are also copied to docker.io/<DOCKERHUB_NAMESPACE>/<name> with the
# same tags. The copy is by digest, so both registries serve the same image
# under the same `sha256:` and a pin moves between them by changing the host.
# GHCR stays the primary: the copy runs after the push and may fail without
# failing the job. It is skipped until the repository variable
# DOCKERHUB_NAMESPACE is set. It also needs the variable DOCKERHUB_USERNAME and
# the secret DOCKERHUB_TOKEN (an access token with read and write scope), and
# the two repositories should already exist on Docker Hub.

on:
  push:
    branches: [main]
    tags: ['career-ops-v*']
  pull_request:
    paths:
      - Dockerfile
      - 'deploy/**'
      - 'publish/**'
      - .dockerignore
      - .hadolint.yaml
      - package.json
      - web/package.json
      - web/package-lock.json
      - tests/cv-visual/Dockerfile
      - .github/workflows/docker-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: "🐳 publish ${{ matrix.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "career-ops"
            context: .
            file: Dockerfile
            platforms: linux/amd64,linux/arm64
          - name: "career-ops-cv-visual"
            context: tests/cv-visual
            file: tests/cv-visual/Dockerfile
            platforms: linux/amd64
          - name: "career-ops-server"
            context: .
            file: deploy/Dockerfile
            platforms: linux/amd64
            mirror: true
          - name: "career-ops-publish"
            context: publish
            file: publish/Dockerfile
            platforms: linux/amd64
            mirror: true
    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "🔍 Lint Dockerfile"
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.file }}
          config: .hadolint.yaml
          failure-threshold: warning
      - name: "🧰 Set up QEMU"
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: contains(matrix.platforms, 'arm64')
      - name: "🧰 Set up Buildx"
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: "🔐 Log in to GHCR"
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=match,pattern=career-ops-v(.*),group=1
      - name: "🚀 Build and push"
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: "🔐 Log in to Docker Hub"
        id: hub-login
        if: github.event_name != 'pull_request' && matrix.mirror && vars.DOCKERHUB_NAMESPACE != ''
        continue-on-error: true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: "🪞 Mirror to Docker Hub"
        id: hub-mirror
        if: steps.hub-login.outcome == 'success'
        continue-on-error: true
        env:
          SOURCE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          TARGET: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/${{ matrix.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(--tag "${TARGET}:${tag##*:}")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$SOURCE"
      - name: "⚠️ Report a failed mirror"
        if: steps.hub-login.outcome == 'failure' || steps.hub-mirror.outcome == 'failure'
        run: echo "::warning title=Docker Hub mirror::${{ matrix.name }} was pushed to GHCR but not copied to Docker Hub. Re-run this job to retry the copy."
