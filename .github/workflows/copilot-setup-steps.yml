# Prepares the environment for Copilot cloud agent sessions.
# Mirrors test.yml: same Node and Go, dependencies installed without
# lifecycle scripts. The agent's network firewall does not apply to this
# job, so this file stays under CODEOWNERS like every other workflow.
name: "🤖 Copilot setup steps"

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

# Cancel superseded runs: a newer push to the same branch or PR replaces the running one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  copilot-setup-steps:
    name: "🤖 Copilot setup steps"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "⬇️ Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "🟢 Set up Node"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: "🐹 Set up Go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: dashboard/go.mod
          cache-dependency-path: dashboard/go.sum
      - name: "📦 Install dependencies"
        run: npm install --ignore-scripts
